<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>KARTALIA v1.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
/* ================================================================
   KARTALIA — MODO ONLINE FIREBASE
   
   Arquitectura:
   /rooms/{roomId}/
     meta/    → { host, guest, created, status }
     state/   → serialized G (escrito por el jugador activo)
     actions/ → { type, pk, ts } — heartbeat + acciones
   
   Flujo:
   1. Host crea sala → genera código 6 letras → escribe en /rooms/{id}/meta
   2. Guest ingresa código → lee meta → escribe su info
   3. Ambos listos → host lanza batalla → escribe state inicial
   4. En cada acción: el jugador activo escribe state completo
   5. Ambos escuchan /rooms/{id}/state con onValue → _fbApplyState()
================================================================ */

let _fbApp      = null;
let _fbDb       = null;
let _fbRoomId   = null;
let _fbRole     = null;   // 'host' | 'guest'
let _fbMyPk     = null;   // 'p1' | 'p2'
let _fbActive   = false;
let _fbListener = null;   // unsubscribe function
let _fbMetaListener = null;
let _fbLastWritten  = 0;
let _fbWriteThrottle= null;
let _fbName    = '';
let _fbEmoji   = '🦊';
let _fbPicks   = [];

const FB_CFG_KEY = 'kartalia_fb_config';

// ── Inicialización ──────────────────────────────────────
function fbInit() {
  const raw = localStorage.getItem(FB_CFG_KEY);
  if(!raw) return false;
  try {
    const cfg = JSON.parse(raw);
    if(!cfg.databaseURL && !cfg.projectId) return false;
    if(!_fbApp) {
      try { _fbApp = firebase.app(); }
      catch(e) { _fbApp = firebase.initializeApp(cfg); }
    }
    _fbDb = firebase.database(_fbApp);
    return true;
  } catch(e) {
    console.error('[FB] init error:', e);
    return false;
  }
}

function fbSaveConfig() {
  const raw = document.getElementById('fb-cfg-input').value.trim();
  const errEl = document.getElementById('fb-cfg-error');
  try {
    const cfg = JSON.parse(raw);
    if(!cfg.apiKey || !cfg.databaseURL) throw new Error('Faltan campos: apiKey y databaseURL son requeridos');
    localStorage.setItem(FB_CFG_KEY, raw);
    if(fbInit()) {
      document.getElementById('fb-config-panel').style.display = 'none';
      document.getElementById('fb-main-panel').style.display   = 'flex';
      toast('🔥 Firebase conectado', 2000);
    } else throw new Error('No se pudo inicializar Firebase con esa config');
  } catch(e) {
    errEl.textContent = '⚠️ ' + e.message;
    errEl.style.display = 'block';
  }
}

function fbResetConfig() {
  localStorage.removeItem(FB_CFG_KEY);
  _fbApp = null; _fbDb = null;
  document.getElementById('fb-config-panel').style.display = 'flex';
  document.getElementById('fb-main-panel').style.display   = 'none';
  document.getElementById('fb-host-panel').style.display   = 'none';
  document.getElementById('fb-join-panel').style.display   = 'none';
  document.getElementById('fb-setup-panel').style.display  = 'none';
}

// ── Navegación ───────────────────────────────────────────
function openFbLobby() {
  // Cargar nombre guardado
  _fbName  = CFG.name1 || localStorage.getItem('kartalia_fb_name') || '';
  _fbEmoji = CFG.emoji1 || '🦊';
  const nameEl = document.getElementById('fb-name-input');
  const emojiEl = document.getElementById('fb-emoji-btn');
  if(nameEl)  nameEl.value = _fbName;
  if(emojiEl) emojiEl.textContent = _fbEmoji;

  // Mostrar panel correcto
  if(fbInit()) {
    document.getElementById('fb-config-panel').style.display = 'none';
    document.getElementById('fb-main-panel').style.display   = 'flex';
  } else {
    document.getElementById('fb-config-panel').style.display = 'flex';
    document.getElementById('fb-main-panel').style.display   = 'none';
  }
  document.getElementById('fb-host-panel').style.display  = 'none';
  document.getElementById('fb-join-panel').style.display  = 'none';
  document.getElementById('fb-setup-panel').style.display = 'none';
  nav('fb-screen');
}

function fbLobbyBack() {
  fbCleanup();
  nav('play-screen');
}

function fbNameChanged() {
  _fbName = document.getElementById('fb-name-input').value.trim();
  localStorage.setItem('kartalia_fb_name', _fbName);
}

function openFbEmojiPicker() {
  const emojis = ['🦊','🐺','🐉','⚔️','🔥','💀','🌙','⚡','🌸','🐯','🦁','🐻','🐼','🦄','🎭','🤖'];
  const picked = emojis[Math.floor(Math.random()*emojis.length)];
  _fbEmoji = picked;
  document.getElementById('fb-emoji-btn').textContent = picked;
}

// ── Crear sala ───────────────────────────────────────────
function fbCreateRoom() {
  if(!fbInit()) { toast('⚠️ Configurá Firebase primero'); return; }
  _fbName = document.getElementById('fb-name-input').value.trim() || 'Jugador';
  if(!_fbName) { toast('⚠️ Ponete un nombre'); document.getElementById('fb-name-input').focus(); return; }

  // Generar código único de 6 letras
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  _fbRoomId = Array.from({length:6}, ()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  _fbRole   = 'host';
  _fbMyPk   = 'p1';

  const roomRef = _fbDb.ref(`rooms/${_fbRoomId}`);
  roomRef.set({
    meta: {
      host:  { name:_fbName, emoji:_fbEmoji, ready:false },
      guest: null,
      status:'waiting',
      created: Date.now(),
      version: 1,
    },
    state: null,
  }).then(()=>{
    // Mostrar código
    document.getElementById('fb-room-code').textContent = _fbRoomId;
    document.getElementById('fb-host-panel').style.display = 'flex';
    document.getElementById('fb-host-dot').className = 'lobby-dot orange';
    document.getElementById('fb-host-status').textContent = '⏳ Esperando a tu amigo...';

    // Escuchar cuando el guest se una
    _fbMetaListener = _fbDb.ref(`rooms/${_fbRoomId}/meta/guest`).on('value', snap=>{
      const guest = snap.val();
      if(!guest) return;
      document.getElementById('fb-host-dot').className = 'lobby-dot green';
      document.getElementById('fb-host-status').textContent = `✅ ${guest.emoji||''} ${guest.name} se conectó`;
      toast(`🔥 ${guest.name} se unió a tu sala`, 2500);
      // Ir a setup de cartas
      fbShowSetup('host', guest);
    });

    // Auto-limpiar sala en 2 horas
    setTimeout(()=>{ try{ _fbDb.ref(`rooms/${_fbRoomId}`).remove(); }catch(e){} }, 7200000);

  }).catch(e=>{ toast('⚠️ Error creando sala: '+e.message, 3000); });
}

function fbCopyCode() {
  if(!_fbRoomId) return;
  navigator.clipboard?.writeText(_fbRoomId).then(()=>toast('📋 Código copiado: '+_fbRoomId, 2000))
    .catch(()=>toast('Código: '+_fbRoomId, 3000));
}

// ── Unirse a sala ─────────────────────────────────────────
function fbShowJoin() {
  document.getElementById('fb-join-panel').style.display = 'flex';
  document.getElementById('fb-host-panel').style.display = 'none';
  setTimeout(()=>document.getElementById('fb-join-input').focus(), 100);
}

function fbJoinRoom() {
  if(!fbInit()) { toast('⚠️ Configurá Firebase primero'); return; }
  _fbName = document.getElementById('fb-name-input').value.trim() || 'Jugador';
  const code = document.getElementById('fb-join-input').value.trim().toUpperCase();
  if(code.length !== 6) { toast('⚠️ El código debe tener 6 letras'); return; }

  const statusEl = document.getElementById('fb-join-status');
  statusEl.style.display = 'block';
  statusEl.textContent = '🔍 Buscando sala...';

  _fbDb.ref(`rooms/${code}/meta`).once('value').then(snap=>{
    const meta = snap.val();
    if(!meta) { statusEl.textContent = '❌ Sala no encontrada'; return; }
    if(meta.status === 'playing') { statusEl.textContent = '❌ La sala ya está en partida'; return; }
    if(meta.guest) { statusEl.textContent = '❌ La sala ya está llena'; return; }

    _fbRoomId = code;
    _fbRole   = 'guest';
    _fbMyPk   = 'p2';

    // Escribir info de guest
    _fbDb.ref(`rooms/${_fbRoomId}/meta/guest`).set({
      name: _fbName, emoji: _fbEmoji, ready: false
    }).then(()=>{
      statusEl.textContent = `✅ Conectado con ${meta.host.emoji||''} ${meta.host.name}`;
      toast(`🔥 ¡Conectado! Sala ${_fbRoomId}`, 2000);
      fbShowSetup('guest', meta.host);
    });
  }).catch(e=>{ statusEl.textContent = '❌ Error: '+e.message; });
}

// ── Setup de cartas ───────────────────────────────────────
function fbShowSetup(role, otherPlayer) {
  document.getElementById('fb-host-panel').style.display  = 'none';
  document.getElementById('fb-join-panel').style.display  = 'none';
  document.getElementById('fb-setup-panel').style.display = 'flex';

  const badge = document.getElementById('fb-connected-badge');
  const other = otherPlayer?.name || '???';
  badge.textContent = `🔥 Conectado con ${otherPlayer?.emoji||''} ${other} · Sala ${_fbRoomId}`;

  // Card pick area — reutilizar lógica del juego
  _fbRenderCardPick();

  // Escuchar cuando el rival esté listo
  _fbDb.ref(`rooms/${_fbRoomId}/meta/${role==='host'?'guest':'host'}/ready`).on('value', snap=>{
    if(snap.val() === true) {
      document.getElementById('fb-ready-status').textContent = `✅ ${other} está listo!`;
      // Si yo también estoy listo → empezar
      if(_fbMyReady) fbCheckBothReady();
    }
  });
}

let _fbMyReady = false;

function _fbRenderCardPick() {
  const area = document.getElementById('fb-card-pick-area');
  if(!area) return;
  const allCards = [...(DB.p1||[]), ...(DB.p2||[])];
  if(allCards.length === 0) {
    area.innerHTML = '<div style="color:var(--text3);font-size:11px;text-align:center;padding:12px;">⚠️ No tenés cartas. Creá cartas en Mis Cartas.</div>';
    return;
  }
  area.innerHTML = `
    <div style="font-size:10px;color:var(--text3);margin-bottom:6px;text-align:center;">Elegí de 3 a 8 cartas para la batalla</div>
    <div id="fb-card-grid" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:200px;overflow-y:auto;"></div>
    <div style="font-size:10px;color:var(--amber2);margin-top:6px;text-align:center;" id="fb-pick-count">0 cartas elegidas</div>`;
  const grid = document.getElementById('fb-card-grid');
  _fbPicks = [];
  allCards.forEach((card, i)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.style.cssText = 'background:var(--bg2);border:1.5px solid var(--card-border);border-radius:10px;padding:6px;cursor:pointer;touch-action:manipulation;width:60px;text-align:center;transition:all .15s;';
    const img = card.img ? `<img src="${card.img}" style="width:100%;height:40px;object-fit:cover;border-radius:6px;display:block;pointer-events:none;">` : `<div style="height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:none;">🃏</div>`;
    btn.innerHTML = `${img}<div style="font-size:7px;color:var(--text);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;">${card.name}</div>`;
    btn.addEventListener('click', ()=>{
      const idx = _fbPicks.indexOf(i);
      if(idx>=0) { _fbPicks.splice(idx,1); btn.style.borderColor='var(--card-border)'; btn.style.background='var(--bg2)'; }
      else if(_fbPicks.length < 8) { _fbPicks.push(i); btn.style.borderColor='var(--amber)'; btn.style.background='rgba(186,117,23,.15)'; }
      else { toast('Máximo 8 cartas'); return; }
      const cnt = _fbPicks.length;
      document.getElementById('fb-pick-count').textContent = `${cnt} carta${cnt!==1?'s':''} elegida${cnt!==1?'s':''}`;
      document.getElementById('fb-ready-btn').disabled = cnt < 3;
    });
    grid.appendChild(btn);
  });
}

function fbPlayerReady() {
  if(_fbPicks.length < 3) { toast('⚠️ Elegí al menos 3 cartas'); return; }
  _fbMyReady = true;
  const btn = document.getElementById('fb-ready-btn');
  btn.disabled = true; btn.textContent = '⏳ Esperando rival...';

  const allCards = [...(DB.p1||[]), ...(DB.p2||[])];
  const myDeck   = _fbPicks.map(i=>cloneCard(allCards[i]));

  // Guardar mi mazo en Firebase
  const myRef = `rooms/${_fbRoomId}/meta/${_fbRole}`;
  _fbDb.ref(myRef).update({ ready:true, deckSize: myDeck.length });

  // Guardar mazo localmente (no subir todo a Firebase para no exceder límites)
  _fbDb.ref(myRef + '/ready').set(true);
  document.getElementById('fb-ready-status').textContent = '⏳ Esperando que tu rival también esté listo...';

  // Guardar mazo en variable para cuando se inicie la batalla
  if(_fbRole==='host') { _onlineP1Deck = myDeck; }
  else { _onlineP2Deck = myDeck; }

  fbCheckBothReady();
}

function fbCheckBothReady() {
  if(!_fbMyReady) return;
  _fbDb.ref(`rooms/${_fbRoomId}/meta`).once('value').then(snap=>{
    const meta = snap.val();
    if(!meta) return;
    const hostReady  = meta.host?.ready  === true;
    const guestReady = meta.guest?.ready === true;
    if(hostReady && guestReady) fbLaunchBattle(meta);
  });
}

function fbLaunchBattle(meta) {
  // Actualizar estado de sala
  _fbDb.ref(`rooms/${_fbRoomId}/meta/status`).set('playing');

  const name1 = meta.host?.name  || 'Jugador 1';
  const name2 = meta.guest?.name || 'Jugador 2';
  CFG.emoji1  = meta.host?.emoji  || '🦊';
  CFG.emoji2  = meta.guest?.emoji || '🐺';

  // Activar modo Firebase online (similar a onlineActive pero con FB)
  onlineActive  = true;
  onlineMyPk    = _fbMyPk;
  onlineRole    = _fbRole;
  _fbActive     = true;
  window._lastBattleMode = 'online';

  PA_BASE = PA_BASE_VAL();
  PA_MAX  = PA_MAX_VAL();

  if(_fbRole === 'host') {
    // Host construye el estado inicial
    const p1Deck = _onlineP1Deck || [];
    const p2Deck = _onlineP2Deck || [];
    G = _buildGState(name1, name2, p1Deck.map(c=>({...c,curHp:c.hp})), p2Deck.map(c=>({...c,curHp:c.hp})));
    dealHand('p1'); dealHand('p2');
    deployFirst('p1'); deployFirst('p2');
    startBgMusic(); nav('battle-screen');
    addLog('🔥 ¡BATALLA FIREBASE INICIADA!','sys');
    renderBattle();
    // Escribir estado inicial en Firebase
    _fbWriteState('LAUNCH');
    // Escuchar acciones del rival
    _fbListenState();
  } else {
    // Guest: escuchar estado del host
    startBgMusic(); nav('battle-screen');
    addLog('🔥 ¡Conectando con el anfitrión...','sys');
    _fbListenState();
  }
}

// ── Sync Firebase ─────────────────────────────────────────
function _fbWriteState(action) {
  if(!_fbActive || !_fbDb || !_fbRoomId || !G) return;
  // Throttle: máx 1 escritura cada 100ms
  if(_fbWriteThrottle) return;
  _fbWriteThrottle = setTimeout(()=>{ _fbWriteThrottle=null; }, 100);

  const snap = serializeG(G);
  snap._action = action || 'SYNC';
  snap._ts     = Date.now();
  snap._by     = _fbMyPk;
  _fbLastWritten = Date.now();

  _fbDb.ref(`rooms/${_fbRoomId}/state`).set(snap)
    .catch(e=>console.warn('[FB] write error:', e));
}

function _fbListenState() {
  if(!_fbDb || !_fbRoomId) return;
  if(_fbListener) {
    _fbDb.ref(`rooms/${_fbRoomId}/state`).off('value', _fbListener);
  }
  _fbListener = _fbDb.ref(`rooms/${_fbRoomId}/state`).on('value', snap=>{
    const state = snap.val();
    if(!state) return;
    // Ignorar estados escritos por mí mismo
    if(state._by === _fbMyPk && state._action !== 'LAUNCH') return;
    if(!G) {
      // Guest: inicializar G vacío y aplicar
      const name1 = state.p1?.name || 'Jugador 1';
      const name2 = state.p2?.name || 'Jugador 2';
      G = _buildGState(name1, name2, [], []);
      G.p1.hand=[]; G.p1.field=null; G.p2.hand=[]; G.p2.field=null;
      _buildOnlineLocalImgMap();
    }
    _applyStateSnap(state);
    G.locked = false;
    renderBattle();
    _showBattleLoadingHint(false);
    if(G.turn === onlineMyPk) setTimeout(()=>{ if(G){ G.locked=false; renderBattle(); }}, 80);
  });

  // Escuchar si el rival abandona
  _fbDb.ref(`rooms/${_fbRoomId}/meta/status`).on('value', snap=>{
    if(snap.val() === 'abandoned' && _fbActive) {
      _fbActive = false; onlineActive = false;
      toast('⚠️ Tu rival abandonó la partida', 4000);
      if(G) {
        const myPl = G[_fbMyPk];
        const el = document.getElementById('win-name');
        if(el) el.textContent = myPl?.name || 'Tú';
        const subEl = document.getElementById('win-sub');
        if(subEl) subEl.textContent = 'Tu rival abandonó — victoria por abandono';
        nav('win-screen');
      }
    }
  });
}

function _fbSyncAfterAction(action) {
  if(!_fbActive) return;
  if(G && G.locked) {
    setTimeout(()=>_fbSyncAfterAction(action), 80);
    return;
  }
  _fbWriteState(action);
  // Si hubo muerte (campo vacío del rival), reenviar después de 500ms
  const oppPk = _fbMyPk==='p1'?'p2':'p1';
  if(G && !G[oppPk].field) {
    setTimeout(()=>{ if(_fbActive&&G) _fbWriteState(action+'_DEATH'); }, 500);
    setTimeout(()=>{ if(_fbActive&&G&&G.deploying) _fbWriteState(action+'_DEATH_2'); }, 1200);
  }
}

function fbCleanup(isAbandon) {
  _fbActive = false;
  onlineActive = false;
  if(_fbListener && _fbDb && _fbRoomId) {
    _fbDb.ref(`rooms/${_fbRoomId}/state`).off('value', _fbListener);
    _fbListener = null;
  }
  if(_fbMetaListener && _fbDb && _fbRoomId) {
    _fbDb.ref(`rooms/${_fbRoomId}/meta/guest`).off('value', _fbMetaListener);
    _fbMetaListener = null;
  }
  if(isAbandon && _fbDb && _fbRoomId) {
    _fbDb.ref(`rooms/${_fbRoomId}/meta/status`).set('abandoned');
  }
  _fbRoomId = null; _fbRole = null; _fbMyPk = null;
  _fbMyReady = false; _fbPicks = [];
  if(_fbWriteThrottle){ clearTimeout(_fbWriteThrottle); _fbWriteThrottle=null; }
}

// Integrar FB sync en las acciones de combate
// (se llama desde _onlineSyncAfterAction que ya existe, pero reemplazamos cuando FB está activo)
const _origOnlineSyncAfterAction = _onlineSyncAfterAction;
function _onlineSyncAfterAction(action, extraMs) {
  if(_fbActive) { setTimeout(()=>_fbSyncAfterAction(action), extraMs||0); return; }
  _origOnlineSyncAfterAction(action, extraMs);
}
const _origOnlineFullSync = _onlineFullSync;
function _onlineFullSync(action) {
  if(_fbActive) { _fbWriteState(action); return; }
  _origOnlineFullSync(action);
}

</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap');
:root {
  --amber:#BA7517; --amber2:#FAC775; --amber3:#FAEEDA;
  --red:#E24B4A;   --red2:#f7c1c1;
  --green:#3B6D11; --green2:#c8e89f;
  --blue:#185FA5;  --blue2:#B5D4F4;
  --purple:#534AB7;--purple2:#CECBF6;
  --cyan:#0e8a8a;  --cyan2:#7de0e0;
  --gray:#444441;  --gray2:#D3D1C7;
  --bg:#0d0d1a; --bg2:#141428; --bg3:#1c1c35; --bg4:#22223f;
  --card-border:#2a2a4a;
  --text:#f0f0ff; --text2:#8888aa; --text3:#555577;
  /* Variables de tema de UI — se sobreescriben via JS al cambiar fondo */
  --ui-bar:#141428;        /* Color de topbars y paneles */
  --ui-bar-border:#2a2a4a; /* Borde de topbars */
  --ui-btn:rgba(255,255,255,.06);  /* Fondo de botones tbtn */
  --ui-btn-border:rgba(255,255,255,.1);
  --ui-fab:var(--amber);   /* Color del FAB (botón flotante) */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* SCREENS */
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;animation:fadeUp .25s ease;}
.screen.active{display:flex;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}

/* TOP BAR */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:var(--ui-bar);border-bottom:1px solid var(--ui-bar-border);flex-shrink:0;}
.topbar h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amber2);}
.topbar .spacer{flex:1;}
.tbtn{background:var(--ui-btn);border:1px solid var(--ui-btn-border);color:var(--text);padding:6px 14px;border-radius:20px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.tbtn:active{background:rgba(255,255,255,.14);}

/* HOME */
#home-screen{background:radial-gradient(ellipse at 50% 0%,#1c1c40 0%,var(--bg) 70%);}
.home-hero{padding:32px 20px 24px;text-align:center;}
.home-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:8px;color:var(--amber2);line-height:1;text-shadow:0 0 40px rgba(186,117,23,.4);}
.home-tagline{font-size:11px;color:var(--text2);letter-spacing:4px;text-transform:uppercase;margin-top:2px;}
.home-icon{font-size:52px;margin:18px 0 4px;filter:drop-shadow(0 0 16px rgba(186,117,23,.5));}
.menu{padding:16px;display:flex;flex-direction:column;gap:10px;}
.mbtn{background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;padding:16px 18px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;transition:border-color .15s,background .15s;}
.mbtn:active{background:var(--bg3);}
.mbtn .mico{font-size:22px;width:30px;text-align:center;}
.mbtn .msub{font-size:11px;color:var(--text2);font-weight:400;display:block;margin-top:2px;}
.mbtn.prime{background:rgba(186,117,23,.15);border-color:var(--amber);}
.mbtn.prime:active{background:rgba(186,117,23,.3);}
.mbtn.prime .mico,.mbtn.prime>div>span:first-child{color:var(--amber2);}

/* SETTINGS */
.settings-section{padding:12px 14px;}
.shead{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--amber2);margin-bottom:10px;}
.scard{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.srow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--card-border);}
.srow:last-child{border-bottom:none;}
.srow .slbl{flex:1;font-size:13px;font-weight:600;}
.sinput{width:100%;background:var(--bg3);border:1px solid var(--card-border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;}
.sinput:focus{outline:none;border-color:var(--amber);}
.sfile-btn{display:inline-block;background:var(--bg3);border:1px solid var(--card-border);border-radius:8px;padding:8px 14px;color:var(--amber2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.sfile-btn:active{background:var(--bg4);}
.sfile-input-hidden{display:none;}

/* ── Settings colapsable nueva UI ── */
.cfg-section{border-radius:16px;overflow:hidden;margin-bottom:8px;border:1px solid var(--card-border);background:var(--bg2);}
.cfg-section-hdr{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;user-select:none;transition:background .15s;}
.cfg-section-hdr:active{background:var(--bg3);}
.cfg-section-ico{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
.cfg-section-txt{flex:1;}
.cfg-section-title{font-size:13px;font-weight:700;color:var(--text);}
.cfg-section-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.cfg-section-arrow{font-size:10px;color:var(--text3);transition:transform .22s;}
.cfg-section-arrow.open{transform:rotate(180deg);}
.cfg-section-body{display:none;border-top:1px solid var(--card-border);}
.cfg-section-body.open{display:block;}
.cfg-row{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid rgba(255,255,255,.04);}
.cfg-row:last-child{border-bottom:none;}
.cfg-row-lbl{flex:1;font-size:12px;font-weight:600;color:var(--text2);}
.cfg-row-sub{font-size:10px;color:var(--text3);display:block;margin-top:1px;font-weight:400;}

/* ── Tienda CSS ── */
#store-screen{background:radial-gradient(ellipse at 50% 0%,#1c1130 0%,var(--bg) 70%);}
.store-hero{padding:20px 20px 6px;text-align:center;}
.store-hero h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--amber2);}
.store-hero-coins{display:inline-flex;align-items:center;gap:6px;background:rgba(186,117,23,.18);border:1px solid rgba(186,117,23,.4);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--amber2);margin-top:6px;}
.store-items{padding:8px 14px 20px;display:flex;flex-direction:column;gap:10px;}
.store-section-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;padding:4px 0 2px;}
.store-item{background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;}
.store-item-hdr{padding:14px 14px 8px;display:flex;align-items:center;gap:12px;}
.store-item-ico{font-size:30px;flex-shrink:0;}
.store-item-info{flex:1;}
.store-item-name{font-size:14px;font-weight:700;color:var(--text);}
.store-item-desc{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4;}
.store-item-cur{font-size:10px;color:var(--amber2);margin-top:3px;font-weight:700;}
.store-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--card-border);border-top:1px solid var(--card-border);}
.store-lvl{background:var(--bg2);padding:11px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:background .15s;position:relative;}
.store-lvl:active:not(.owned):not(.current){background:var(--bg3);}
.store-lvl.owned{background:rgba(59,109,17,.12);cursor:default;}
.store-lvl.current{background:rgba(186,117,23,.13);cursor:default;}
.store-lvl-num{font-size:9px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;font-weight:700;}
.store-lvl.owned .store-lvl-num{color:var(--green2);}
.store-lvl.current .store-lvl-num{color:var(--amber2);}
.store-lvl-effect{font-size:12px;font-weight:800;color:var(--text);}
.store-lvl-price{font-size:11px;font-weight:700;color:var(--amber2);}
.store-lvl.owned .store-lvl-price{color:var(--green2);}
.store-lvl-tag{font-size:8px;border-radius:5px;padding:1px 5px;font-weight:700;margin-top:1px;}
.store-lvl.owned .store-lvl-tag{background:rgba(59,109,17,.3);color:var(--green2);}
.store-lvl.current .store-lvl-tag{background:rgba(186,117,23,.25);color:var(--amber2);}








.audio-list{padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
.audio-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:8px;padding:6px 10px;}
.audio-item .aname{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.audio-item .adel{background:none;border:none;color:var(--red2);font-size:16px;cursor:pointer;padding:0 4px;}
.audio-item .aplay{background:none;border:none;color:var(--amber2);font-size:14px;cursor:pointer;padding:0 4px;}

/* CARDS */
.ptabs{display:flex;border-bottom:1px solid var(--card-border);flex-shrink:0;}
.ptab{flex:1;padding:11px 8px;text-align:center;font-weight:700;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;}
.ptab.on{color:var(--amber2);border-bottom-color:var(--amber2);}
.cards-grid{display:flex;flex-direction:column;gap:0;padding:0 0 calc(88px + env(safe-area-inset-bottom,0px));}
.card-wrap{cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05);background:transparent;transition:background .12s;}
.card-wrap:active{background:var(--bg2);}
.card-wrap-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--card-border);}
.card-wrap-thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
.card-wrap-info{flex:1;min-width:0;}
.card-wrap-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-wrap-stats{font-size:11px;color:var(--text3);margin-top:2px;}
.card-wrap-skill{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-wrap-actions{display:flex;gap:6px;flex-shrink:0;}
/* === KARD — diseño minimalista y limpio === */
.kard{
  width:130px;
  background:linear-gradient(160deg,var(--bg3) 0%,var(--bg2) 100%);
  border:1.5px solid var(--card-border);
  border-radius:16px;
  overflow:hidden;
  transition:transform .15s,box-shadow .15s;
  display:flex;
  flex-direction:column;
}
/* Imagen */
.kard .k-img{width:100%;height:82px;object-fit:cover;display:block;flex-shrink:0;}
.kard .k-noimgbox{
  width:100%;height:82px;
  background:linear-gradient(135deg,var(--bg3),var(--bg));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
}
/* Nombre */
.kard .k-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;letter-spacing:.8px;
  color:var(--amber2);
  padding:5px 8px 3px;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex-shrink:0;
}
/* Divisor bajo el nombre */
.kard .k-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--card-border),transparent);
  margin:0 10px;
  flex-shrink:0;
}
/* Stats HP / ATK */
.kard .k-stats{
  display:flex;
  justify-content:space-evenly;
  padding:5px 4px 6px;
  gap:2px;
  flex-shrink:0;
}
.kard .k-st{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(255,255,255,.04);
  border-radius:8px;
  padding:3px 10px;
  min-width:44px;
}
.kard .k-st .v{font-family:'Bebas Neue',sans-serif;font-size:19px;line-height:1;letter-spacing:.5px;}
.kard .k-st .l{font-size:7px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-top:1px;}
.kard .k-st.hp .v{color:#7CFC00;}
.kard .k-st.atk .v{color:#FF6B6B;}
/* Habilidad */
.kard .k-skill{
  font-size:8.5px;
  color:var(--text2);
  padding:4px 7px 5px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.05);
  min-height:24px;
  display:flex;align-items:center;justify-content:center;
  line-height:1.35;
  flex-shrink:0;
}
/* Afinidad */
.kard .k-aff{
  display:flex;align-items:center;justify-content:center;
  gap:3px;font-size:8px;font-weight:700;
  padding:3px 5px 4px;
  border-top:1px solid rgba(255,255,255,.05);
  letter-spacing:.3px;
  flex-shrink:0;
}
/* Descripción */
.kard .k-desc{
  font-size:8px;color:var(--text3);
  padding:3px 7px 5px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.04);
  font-style:italic;line-height:1.35;
  overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  flex-shrink:0;
}
.card-actions{display:flex;gap:5px;justify-content:center;}
.ca-btn{font-size:11px;font-weight:700;padding:6px 10px;border-radius:10px;border:none;cursor:pointer;letter-spacing:.2px;white-space:nowrap;}
.ca-edit{background:rgba(186,117,23,.18);color:var(--amber2);border:1px solid rgba(186,117,23,.28);}
.ca-del{background:rgba(226,75,74,.15);color:var(--red2);border:1px solid rgba(226,75,74,.25);}
.ca-btn:active{transform:scale(.93);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text2);}
.empty-state .big{font-size:48px;margin-bottom:12px;}
/* ── Deck manager CSS ── */
.deck-bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--card-border);background:var(--bg);}
.deck-bar-label{font-size:11px;color:var(--text3);font-weight:700;flex-shrink:0;}
.deck-bar-name{flex:1;font-size:12px;font-weight:700;color:var(--amber2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.deck-bar-btn{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 10px;border-radius:9px;border:none;cursor:pointer;white-space:nowrap;}
.deck-save-btn{background:rgba(59,109,17,.2);color:var(--green2);border:1px solid rgba(59,109,17,.4);}
.deck-load-btn{background:rgba(186,117,23,.15);color:var(--amber2);border:1px solid rgba(186,117,23,.35);}
.deck-bar-btn:active{transform:scale(.93);}
.cards-section-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;background:var(--bg);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:5;}
.cards-section-count{flex:1;font-size:11px;color:var(--text3);}
.cards-section-clear{font-size:11px;color:var(--red2);background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.2);border-radius:8px;padding:4px 10px;cursor:pointer;}
.deck-modal-slot{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.deck-modal-slot:last-child{border-bottom:none;}
.deck-modal-slot-name{flex:1;font-size:13px;font-weight:700;}
.deck-modal-slot-meta{font-size:10px;color:var(--text3);}
.deck-modal-slot-btn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom, 0px));right:18px;background:var(--ui-fab);color:#fff;border:none;border-radius:50px;padding:13px 22px;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(186,117,23,.5);z-index:50;transition:transform .12s,background .25s,box-shadow .12s;}
.fab:active{transform:scale(.93);}
.fab:disabled{opacity:.5;cursor:not-allowed;}

/* EDITOR */
.editor-body{flex:1;overflow-y:auto;padding:0 0 90px;}
.editor-body::-webkit-scrollbar{display:none;}
.fsec{margin-bottom:16px;}
.flbl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;display:block;}
.finput{width:100%;background:var(--bg2);border:1px solid var(--card-border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;}
.finput:focus{outline:none;border-color:var(--amber);}
/* Preview — siempre visible arriba */
.preview-wrap{display:flex;justify-content:center;padding:14px 14px 0;flex-shrink:0;background:var(--bg);}
.kard.preview{width:150px;}
.kard.preview .k-img,.kard.preview .k-noimgbox{height:98px;}
.kard.preview .k-name{font-size:15px;padding:6px 8px 4px;}
.kard.preview .k-st .v{font-size:21px;}

/* Editor tabs */
.etabs-bar{display:flex;border-bottom:1px solid var(--card-border);background:var(--bg);flex-shrink:0;margin-top:10px;}
.etab{flex:1;padding:10px 4px 9px;text-align:center;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;letter-spacing:.2px;}
.etab.on{color:var(--amber2);border-bottom-color:var(--amber2);}
.etab-panel{display:none;padding:14px 14px 0;}
.etab-panel.on{display:block;}

/* Sticky preview en desktop */
@media(min-width:768px){
  .editor-body{display:flex;flex-direction:column;height:100%;}
  .editor-preview-sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding-bottom:0;flex-shrink:0;}
  .editor-scroll-area{flex:1;overflow-y:auto;}
  .editor-scroll-area::-webkit-scrollbar{display:none;}
}

/* Detalles opcionales (colapsable en tab Info) */
.opt-details-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg2);border:1px solid var(--card-border);border-radius:12px;color:var(--text2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;margin-bottom:4px;}
.opt-details-toggle:active{background:var(--bg3);}
.opt-details-arrow{margin-left:auto;font-size:11px;color:var(--text3);transition:transform .2s;}
.opt-details-arrow.open{transform:rotate(180deg);}
.opt-details-body{display:none;}
.opt-details-body.open{display:block;}
.img-upload-zone{background:var(--bg2);border:2px dashed var(--card-border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s;}
.img-upload-zone:active{border-color:var(--amber);}
.img-upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uploaded-img{width:100%;max-height:140px;object-fit:cover;border-radius:8px;display:none;}
.upload-hint{color:var(--text2);font-size:13px;}
.stat-row{display:flex;align-items:center;gap:10px;}
.sbadge{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;min-width:44px;text-align:center;flex-shrink:0;}
.sbadge.hp{background:rgba(59,109,17,.4);color:var(--green2);}
.sbadge.atk{background:rgba(163,45,45,.4);color:var(--red2);}
.sbadge.rem{background:rgba(83,74,183,.3);color:var(--purple2);font-size:10px;}
input[type=range]{flex:1;-webkit-appearance:none;background:rgba(255,255,255,.1);border-radius:4px;height:6px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;}
#inp-hp::-webkit-slider-thumb{background:var(--green2);}
#inp-atk::-webkit-slider-thumb{background:var(--red2);}
#inp-skill-pa::-webkit-slider-thumb{background:var(--purple2);}

/* Slider de volumen de música — profesional */
#music-vol {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 6px;
  border-radius: 6px;
  outline: none;
  cursor: pointer;
  background: linear-gradient(to right, var(--amber) 50%, rgba(255,255,255,.12) 50%);
  transition: background .05s;
}
#music-vol::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--amber2);
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(186,117,23,.25), 0 2px 6px rgba(0,0,0,.5);
  transition: box-shadow .15s, transform .15s;
  border: 2px solid rgba(255,255,255,.15);
}
#music-vol::-webkit-slider-thumb:active {
  box-shadow: 0 0 0 6px rgba(186,117,23,.35), 0 2px 8px rgba(0,0,0,.6);
  transform: scale(1.15);
}
#music-vol::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--amber2);
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(186,117,23,.25);
  border: 2px solid rgba(255,255,255,.15);
}
#music-vol::-moz-range-track {
  height: 6px; border-radius: 6px;
  background: rgba(255,255,255,.12);
}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.skill-sec-wrap{padding:0!important;overflow:hidden;border-radius:14px;border:1px solid var(--card-border);background:var(--bg2);}
.skill-sec-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:13px 14px;background:none;border:none;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:left;}
.skill-sec-toggle:active{background:rgba(255,255,255,.05);}
.skill-sec-icon{font-size:16px;}
.skill-sec-badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--text2);background:var(--bg3);border-radius:20px;padding:2px 8px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.skill-sec-badge.active{color:var(--amber2);background:rgba(186,117,23,.18);}
.skill-sec-arrow{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0;}
.skill-sec-arrow.open{transform:rotate(180deg);}
.skill-sec-body{display:none;padding:10px 12px 14px;border-top:1px solid var(--card-border);}
.skill-sec-body.open{display:block;}
.skill-sub-cfg{margin-top:10px;border-radius:10px;padding:10px 12px;}
.cfg-heal{background:rgba(59,109,17,.12);border:1px solid rgba(59,109,17,.3);}
.cfg-fire{background:rgba(180,50,10,.12);border:1px solid rgba(220,80,20,.35);}
.cfg-regen{background:rgba(150,120,0,.12);border:1px solid rgba(200,160,0,.3);}
.cfg-pasurge{background:rgba(40,60,180,.12);border:1px solid rgba(80,100,220,.35);}
.sub-cfg-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px;}
.sub-cfg-label b{color:var(--amber2);}
.sub-cfg-label small{color:var(--text3);font-weight:400;}
.sub-cfg-note{font-size:10px;color:var(--red2);margin-bottom:7px;padding:4px 8px;background:rgba(226,75,74,.1);border-radius:6px;}
/* Afinidad */
.aff-sec-wrap{padding:0!important;overflow:hidden;border-radius:14px;border:1px solid var(--card-border);background:var(--bg2);}
.aff-note{font-size:10px;color:var(--text3);margin-bottom:10px;line-height:1.4;}
.aff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.aff-opt{background:var(--bg3);border:2px solid var(--card-border);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;transition:all .15s;}
.aff-opt:active{opacity:.7;}
.aff-opt.on{border-color:var(--aff-color,var(--amber));background:rgba(var(--aff-rgb,186,117,23),.15);}
.aff-opt .aff-emoji{font-size:20px;display:block;margin-bottom:3px;}
.aff-opt .aff-name{font-size:10px;font-weight:700;color:var(--text2);}
.aff-opt.on .aff-name{color:var(--amber2);}
.aff-desc-box{margin-top:10px;min-height:32px;font-size:11px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:8px 10px;line-height:1.5;display:none;}
.aff-desc-box.show{display:block;}
.kard .k-aff{display:flex;align-items:center;justify-content:center;gap:3px;font-size:8px;font-weight:700;padding:2px 5px 4px;border-top:1px solid var(--card-border);letter-spacing:.3px;opacity:.9;}
.skill-opt{background:var(--bg2);border:1.5px solid var(--card-border);border-radius:10px;padding:9px 7px;cursor:pointer;text-align:center;transition:all .15s;}
.skill-opt.on{border-color:var(--amber);background:rgba(186,117,23,.15);}
.skill-opt .sn{font-size:12px;font-weight:700;color:var(--text);}
.skill-opt .sd{font-size:10px;color:var(--text2);margin-top:2px;}
.skill-opt.on .sn{color:var(--amber2);}
.skill-opt.on .sd{color:rgba(250,199,117,.7);}

/* MODE */
.mode-hero{padding:28px 20px 16px;text-align:center;}
.mode-hero h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--amber2);}
.mode-hero p{font-size:12px;color:var(--text2);margin-top:4px;}
.mode-cards{padding:14px;display:flex;flex-direction:column;gap:12px;}
.mode-card{background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;padding:18px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;}
.mode-card:active{background:var(--bg3);border-color:var(--amber);}
.mode-card .mico2{font-size:28px;flex-shrink:0;}
.mode-card h3{font-size:15px;font-weight:700;margin-bottom:4px;}
.mode-card p{font-size:12px;color:var(--text2);}

/* SETUP */
.setup-sec{padding:0 14px 14px;}
.setup-player-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 0 8px;
}
.setup-player-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
}
.setup-player-dot.p1{background:#e05050;}
.setup-player-dot.p2{background:#4a90e2;}
.setup-sec h3{
  font-family:'Bebas Neue',sans-serif;font-size:19px;
  letter-spacing:1.5px;color:var(--text);margin:0;flex:1;
}
.setup-sec .setup-sub{font-size:11px;color:var(--text2);margin-bottom:9px;line-height:1.5;}
/* Divider between player sections */
.setup-divider{height:1px;background:linear-gradient(90deg,transparent,var(--card-border),transparent);margin:4px 0 14px;}
/* Card pick grid — wraps instead of horizontal scroll */
.hscroll{display:flex;flex-wrap:wrap;gap:9px;padding-bottom:8px;}
.hscroll::-webkit-scrollbar{display:none;}
/* Selection card wrapper */
.sel-card-wrap{flex-shrink:0;cursor:pointer;position:relative;}
.sel-card-wrap .kard{transition:border-color .2s,box-shadow .2s,transform .15s;}
.sel-card-wrap:active .kard{transform:scale(.96);}
.sel-card-wrap.picked .kard{
  border-color:var(--amber) !important;
  box-shadow:0 0 0 1px var(--amber),0 0 14px rgba(186,117,23,.35);
}
/* Pick checkmark badge */
.sel-card-wrap .pick-check{
  position:absolute;top:6px;right:6px;
  width:20px;height:20px;
  background:var(--amber);border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:900;
  box-shadow:0 1px 6px rgba(0,0,0,.4);
}
.sel-card-wrap.picked .pick-check{display:flex;}
/* Pick info bar */
.pick-info{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--text2);
  background:var(--bg2);border:1px solid var(--card-border);
  border-radius:10px;padding:7px 12px;margin-top:8px;
}
.pick-info .pi-count{
  font-family:'Bebas Neue',sans-serif;font-size:16px;
  color:var(--amber2);letter-spacing:.5px;
}
.pick-info .pi-sep{color:var(--text3);}
.pick-info .pi-starter{color:var(--amber2);font-weight:700;}
/* Name inputs */
.name-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 8px;}
.name-field label{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;}
/* Start button */
.start-row{
  position:sticky;bottom:0;
  padding:10px 14px 16px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  z-index:10;
}
.start-btn{
  width:100%;
  background:linear-gradient(135deg,rgba(59,109,17,.4),rgba(59,109,17,.2));
  border:1px solid #639922;color:var(--green2);
  border-radius:16px;padding:16px;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  cursor:pointer;transition:all .15s;
  text-shadow:0 0 20px rgba(99,153,34,.5);
}
.start-btn:active:not(:disabled){background:rgba(59,109,17,.55);transform:scale(.98);}
.start-btn:disabled{opacity:.3;cursor:not-allowed;}

/* BATTLE */
#battle-screen{background:radial-gradient(ellipse at 30% 50%,rgba(186,117,23,.06) 0%,var(--bg) 60%),radial-gradient(ellipse at 70% 50%,rgba(83,74,183,.06) 0%,transparent 60%),var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background 0.6s ease;}
#battle-screen.turn-p1{background:radial-gradient(ellipse at 20% 45%,rgba(226,75,74,.09) 0%,var(--bg) 55%),radial-gradient(ellipse at 75% 55%,rgba(83,74,183,.04) 0%,transparent 50%),var(--bg);}
#battle-screen.turn-p2{background:radial-gradient(ellipse at 80% 45%,rgba(83,74,183,.09) 0%,var(--bg) 55%),radial-gradient(ellipse at 25% 55%,rgba(226,75,74,.04) 0%,transparent 50%),var(--bg);}
#battle-screen.turn-nightmare{background:radial-gradient(ellipse at 50% 40%,rgba(100,0,150,.12) 0%,var(--bg) 60%),radial-gradient(ellipse at 50% 80%,rgba(60,0,90,.08) 0%,transparent 50%),var(--bg);}
#battle-screen .battle-header{background:rgba(0,0,0,.78);backdrop-filter:blur(10px);}
#battle-screen .actions{background:rgba(0,0,0,.22);}
#battle-screen .hand-area{background:rgba(0,0,0,.5);backdrop-filter:blur(8px);}

/* ── BATTLE LAYOUT: flex column, hand always visible ── */
#battle-screen .arena{flex:1;min-height:0;overflow:hidden;}
#battle-screen .actions{flex-shrink:0;}
#battle-screen .hand-area{flex-shrink:0;}

/* ── LOG OVERLAY — historial superpuesto ── */
#log-overlay{
  display:none;position:fixed;inset:0;z-index:400;
  background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.88) 30%, rgba(0,0,0,.96) 100%);
  flex-direction:column;justify-content:flex-end;
  animation:logFadeIn .2s ease;
}
#log-overlay.open{display:flex;}
@keyframes logFadeIn{from{opacity:0;}to{opacity:1;}}
.log-overlay-inner{
  max-height:65vh;display:flex;flex-direction:column;
  padding:0 0 calc(12px + env(safe-area-inset-bottom,0px));
}
.log-overlay-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  border-top:1px solid rgba(255,255,255,.08);
}
.log-overlay-title{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;
  color:var(--amber2);
}
.log-overlay-close{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:var(--text);border-radius:20px;padding:5px 14px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;
}
.log-overlay-close:active{background:rgba(255,255,255,.2);}
.log-overlay-scroll{
  flex:1;overflow-y:auto;padding:4px 16px 8px;
  display:flex;flex-direction:column;gap:2px;
}
.log-overlay-scroll::-webkit-scrollbar{display:none;}

/* ── Botón flotante de historial ── */
#log-fab{
  position:fixed;right:14px;bottom:calc(110px + env(safe-area-inset-bottom,0px));
  background:rgba(30,30,60,.85);border:1px solid rgba(255,255,255,.15);
  border-radius:22px;padding:7px 13px;
  font-size:11px;font-weight:700;color:var(--text2);
  cursor:pointer;z-index:50;backdrop-filter:blur(6px);
  display:none;transition:opacity .2s;
  line-height:1;gap:5px;align-items:center;
}
#log-fab.visible{display:flex;}
#log-fab:active{background:rgba(50,50,90,.9);}

/* Header */
.battle-header{
  padding:2px 10px 2px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;flex-direction:column;gap:1px;
}
.battle-header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.battle-header-left{display:flex;flex-direction:column;gap:0px;}
.turn-big{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--amber2);}
.turn-sub{font-size:8.5px;color:var(--text2);letter-spacing:.3px;}

/* PA PANEL DUAL — ambos jugadores */
.pa-dual{display:flex;gap:5px;width:100%;}
.pa-player-bar{
  flex:1;display:flex;flex-direction:column;gap:2px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:3px 6px 3px;min-width:0;
  transition:border-color .25s,background .25s;
}
.pa-player-bar.is-active{
  border-color:rgba(186,117,23,.5);
  background:rgba(186,117,23,.07);
  box-shadow:0 0 10px rgba(186,117,23,.08);
}
.pa-player-bar.is-active .pa-player-name{color:var(--amber2);}
.pa-player-name{
  font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;
  color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;
}
.pa-player-name .pa-turn-dot{
  width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;
  box-shadow:0 0 5px rgba(250,199,117,.7);
  animation:turnBlink 1s ease-in-out infinite;
}
/* PA Segments — RNA style */
.pa-pips-row{
  display:flex;gap:3px;align-items:flex-end;flex-wrap:nowrap;overflow:hidden;
  height:14px;
}
.pa-pip{
  width:10px;height:8px;border-radius:2px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:background .18s,box-shadow .18s,height .18s;
  flex-shrink:0;
}
/* PA base activos — dorado */
.pa-pip.on{
  background:linear-gradient(180deg,var(--amber2) 0%,var(--amber) 100%);
  border-color:var(--amber2);
  box-shadow:0 0 5px rgba(186,117,23,.6);
  height:12px;
}
/* PA bonus (extra sobre la base) — cian */
.pa-pip.on.bonus{
  background:linear-gradient(180deg,var(--cyan2) 0%,var(--cyan) 100%);
  border-color:var(--cyan2);
  box-shadow:0 0 5px rgba(14,138,138,.65);
  height:14px;
}
/* PA vacío pero es slot bonus — ligeramente distinto */
.pa-pip.bonus-empty{
  background:rgba(14,138,138,.06);
  border-color:rgba(14,138,138,.2);
}
/* Pips compactos cuando hay muchos (PA alto por bonus de tienda) */
.pa-pip.small{width:7px;height:6px;border-radius:1.5px;}
.pa-pip.on.small{height:9px;}
.pa-pip.on.bonus.small{height:11px;}
.pa-pips-row{gap:2px;}
.pa-row-wrap{display:flex;align-items:center;gap:4px;}
.pa-num{
  font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--amber2);
  letter-spacing:.5px;line-height:1;flex-shrink:0;
  min-width:16px;text-align:right;
}
.pa-num.zero{color:var(--text3);}
.pa-bonus-chip{
  font-size:7.5px;font-weight:800;color:var(--cyan2);
  background:rgba(14,138,138,.18);border:1px solid rgba(14,138,138,.4);
  border-radius:6px;padding:1px 5px;white-space:nowrap;margin-left:1px;
  letter-spacing:.3px;
}

/* HEAL ROW — debajo de PA row, visible cuando carta tiene regen/sacRegen activo */
.heal-row{display:none;gap:3px;align-items:center;flex-wrap:wrap;max-width:200px;margin-top:3px;}
.heal-row.visible{display:flex;}
.heal-pip{width:10px;height:10px;border-radius:50%;background:rgba(124,252,0,.12);border:1px solid rgba(124,252,0,.25);}
.heal-pip.on{background:#7CFC00;border-color:#a0ff40;box-shadow:0 0 5px rgba(124,252,0,.55);}
.heal-lbl-tag{font-size:9px;color:#7CFC00;font-weight:700;margin-left:3px;white-space:nowrap;}
/* Legacy — unused but keep for compat */
.pa-row{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:180px;}
.pa-lbl{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-right:3px;}
.pa-bonus-tag{font-size:9px;color:var(--cyan2);font-weight:700;margin-left:4px;white-space:nowrap;}

/* Arena */
.arena{
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:4px 6px 2px;flex-shrink:0;position:relative;
}
.arena::before{
  content:'VS';position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-family:'Bebas Neue',sans-serif;font-size:14px;
  color:rgba(255,255,255,.06);letter-spacing:4px;pointer-events:none;
}
.fighter{text-align:center;width:130px;}
.fighter .f-lbl{
  font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--text2);margin-bottom:5px;transition:color .3s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.fighter.is-active .f-lbl{color:var(--amber2);}
.turn-indicator{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--amber);vertical-align:middle;
  animation:turnBlink 1s ease-in-out infinite;
}
@keyframes turnBlink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
.fighter .kard{margin:0 auto;width:108px;}
.fighter .kard .k-img,.fighter .kard .k-noimgbox{height:68px;}
.fighter .kard .k-name{font-size:11px;padding:3px 6px 2px;}
.fighter .kard .k-st .v{font-size:16px;}
.fighter .kard .k-skill{font-size:7.5px;min-height:20px;padding:3px 5px 4px;}
.fighter .kard .k-aff{font-size:7px;padding:2px 5px 3px;}
.fighter .kard.active-card{
  box-shadow:0 0 0 2px var(--amber),0 0 20px rgba(186,117,23,.45),0 0 44px rgba(186,117,23,.12);
  animation:activeCardPulse 1.8s ease-in-out infinite;
}
@keyframes activeCardPulse{
  0%,100%{box-shadow:0 0 0 2px var(--amber),0 0 16px rgba(186,117,23,.4),0 0 36px rgba(186,117,23,.1);}
  50%{box-shadow:0 0 0 2.5px var(--amber2),0 0 26px rgba(250,199,117,.55),0 0 50px rgba(186,117,23,.2);}
}
/* ── Active fighter glowing ring ── */
.fighter.is-active{
  position:relative;
}
.fighter.is-active::before{
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:20px;
  background:transparent;
  border:2px solid rgba(186,117,23,.35);
  pointer-events:none;
  animation:fighterRingPulse 1.8s ease-in-out infinite;
}
@keyframes fighterRingPulse{
  0%,100%{border-color:rgba(186,117,23,.2);box-shadow:0 0 10px rgba(186,117,23,.1);}
  50%{border-color:rgba(250,199,117,.5);box-shadow:0 0 20px rgba(186,117,23,.25);}
}
.hpbar-wrap{margin:7px auto 0;width:120px;background:rgba(255,255,255,.08);border-radius:10px;height:6px;overflow:hidden;}
.hpbar{height:100%;border-radius:10px;transition:width .4s ease,background .4s;}
.hp-txt{font-size:10px;color:var(--text2);margin-top:4px;font-weight:600;}
.status-row{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap;min-height:16px;}
.stbadge{font-size:7.5px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(83,74,183,.25);color:var(--purple2);text-transform:uppercase;letter-spacing:.3px;border:1px solid rgba(83,74,183,.3);}

/* SHAKE */
@keyframes shakeCard{0%,100%{transform:translateX(0) scale(1);}10%{transform:translateX(-10px) scale(1.03);}25%{transform:translateX(9px) scale(.98);}40%{transform:translateX(-7px) scale(1.02);}55%{transform:translateX(6px) scale(.99);}70%{transform:translateX(-4px);}85%{transform:translateX(3px);}}
.shake{animation:shakeCard .45s cubic-bezier(.36,.07,.19,.97);}
/* HIT FLASH — parpadeo rojo al recibir daño — más dramático */
@keyframes hitFlash{0%{filter:brightness(1) saturate(1);}12%{filter:brightness(3.5) saturate(0) contrast(1.5);}30%{filter:brightness(2.2) sepia(1) hue-rotate(290deg) saturate(2);}55%{filter:brightness(1.6) sepia(.4) hue-rotate(310deg);}100%{filter:brightness(1) saturate(1);}}
.hit-flash{animation:hitFlash .42s ease;}
/* CRIT FLASH — destello dorado especial para críticos */
@keyframes critFlash{0%{filter:brightness(1);}15%{filter:brightness(4) saturate(0);}35%{filter:brightness(2.5) sepia(1) hue-rotate(20deg) saturate(3);}65%{filter:brightness(1.8) sepia(.5) hue-rotate(30deg);}100%{filter:brightness(1);}}
.crit-flash{animation:critFlash .5s ease;}

/* DAMAGE FLOAT */
.dmg-float{position:fixed;font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:900;pointer-events:none;z-index:300;text-shadow:0 2px 10px rgba(0,0,0,.9);animation:floatUp 1s ease forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.85);}15%{transform:translateY(-12px) scale(1.35);}55%{opacity:1;transform:translateY(-62px) scale(1.15);}100%{opacity:0;transform:translateY(-100px) scale(.8);}}
.dmg-float.miss{color:#888;font-size:20px;}
.dmg-float.crit{color:#ffee00;font-size:44px;text-shadow:0 0 22px rgba(255,238,0,.9),0 0 40px rgba(255,200,0,.5),0 2px 8px rgba(0,0,0,.9);animation:floatUpCrit 1.1s ease forwards;}
@keyframes floatUpCrit{0%{opacity:1;transform:translateY(0) scale(.7) rotate(-3deg);}12%{transform:translateY(-8px) scale(1.6) rotate(2deg);}40%{opacity:1;transform:translateY(-55px) scale(1.25) rotate(-1deg);}100%{opacity:0;transform:translateY(-105px) scale(.9) rotate(0deg);}}
.dmg-float.dmg{color:#FF6B6B;}
.dmg-float.heal{color:#7CFC00;}
.dmg-float.frozen{color:var(--cyan2);font-size:16px;}

/* ACCIONES — más compactas, 3 columnas */
.actions{
  padding:4px 8px 4px;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:3px;flex-shrink:0;
}
.abtn{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:5px 3px 4px;
  color:var(--text);font-family:'Nunito',sans-serif;
  font-size:9.5px;font-weight:700;cursor:pointer;
  text-align:center;transition:all .12s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  line-height:1.2;
}
.abtn:active:not(:disabled){transform:scale(.95);}
.abtn:disabled{cursor:not-allowed;}
.abtn .cost{font-size:7.5px;color:var(--text2);display:block;margin-top:1px;line-height:1.1;}
.passive-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.passive-opt{background:var(--bg2);border:1.5px solid var(--card-border);border-radius:10px;padding:9px 7px;cursor:pointer;text-align:center;transition:all .15s;}
.passive-opt.on{border-color:#7de0e0;background:rgba(14,138,138,.15);}
.passive-opt .sn{font-size:12px;font-weight:700;color:var(--text);}
.passive-opt .sd{font-size:10px;color:var(--text2);margin-top:2px;}
.passive-opt.on .sn{color:#7de0e0;}
.passive-opt.on .sd{color:rgba(125,224,224,.7);}

/* COLOR SWATCHES */
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:transform .1s,border-color .1s;flex-shrink:0;}
.color-swatch:active{transform:scale(.9);}
.color-swatch.active-swatch{border-color:#fff;transform:scale(1.15);}

/* BOTONES +/- */
.pm-btn{background:var(--bg3);border:1px solid var(--card-border);color:var(--text);border-radius:8px;width:30px;height:30px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1;}
.pm-btn:active{background:var(--amber);color:#fff;}

/* Setup scroll fix DPI alto */
#setup-screen .scroll{max-height:calc(100dvh - 120px);overflow-y:auto;}
/* Setup card list — cuadrícula flexible para ver muchas cartas */
.hscroll{display:flex;flex-wrap:wrap;gap:9px;padding-bottom:8px;min-height:150px;}
.hscroll::-webkit-scrollbar{height:3px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:4px;}

/* ATK — rojo */
.abtn.a-atk{background:linear-gradient(150deg,rgba(226,75,74,.22),rgba(180,40,40,.1));border-color:rgba(226,75,74,.55);color:#ff8080;}
.abtn.a-atk:active:not(:disabled){background:linear-gradient(150deg,rgba(226,75,74,.38),rgba(180,40,40,.22));}
.abtn.a-atk:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
.abtn.a-sk.disabled-skill{border-color:rgba(255,255,255,.08);color:var(--text3);cursor:default;}
/* Habilidad — violeta */
.abtn.a-sk{background:linear-gradient(150deg,rgba(83,74,183,.2),rgba(60,50,150,.1));border-color:rgba(83,74,183,.5);color:var(--purple2);}
.abtn.a-sk:active:not(:disabled){background:linear-gradient(150deg,rgba(83,74,183,.32),rgba(60,50,150,.18));}
.abtn.a-sk:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
.abtn.a-sk.disabled-skill{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);cursor:default;pointer-events:none;}
/* Cargar — cyan */
.abtn.a-ch{background:linear-gradient(150deg,rgba(14,138,138,.2),rgba(0,100,100,.1));border-color:rgba(14,138,138,.5);color:var(--cyan2);}
.abtn.a-ch:active:not(:disabled){background:linear-gradient(150deg,rgba(14,138,138,.32),rgba(0,100,100,.18));}
.abtn.a-ch:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
/* Pasar — siempre disponible, atenuado levemente si bloqueado */
.abtn.a-pa{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:var(--text2);}
.abtn.a-pa:active:not(:disabled){background:rgba(255,255,255,.1);}
.abtn.a-pa:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06);color:var(--text3);opacity:.4;}
/* ── Botón Pasar resaltado cuando no hay PA ── */
@keyframes nmBannerPulse{
  0%,100%{background:linear-gradient(90deg,rgba(100,0,150,.28),rgba(60,0,90,.18),rgba(100,0,150,.28));border-top-color:rgba(156,39,176,.5);border-bottom-color:rgba(156,39,176,.5);}
  50%{background:linear-gradient(90deg,rgba(130,0,200,.38),rgba(80,0,120,.28),rgba(130,0,200,.38));border-top-color:rgba(200,70,230,.7);border-bottom-color:rgba(200,70,230,.7);}
}
@keyframes passPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(250,199,117,0),0 0 0 0 rgba(250,199,117,0);border-color:rgba(186,117,23,.5);}
  50%{box-shadow:0 0 8px 2px rgba(250,199,117,.25),0 0 18px 4px rgba(186,117,23,.15);border-color:rgba(250,199,117,.85);}
}
.abtn.a-pa.pass-pulse{
  animation:passPulse 1.8s ease-in-out infinite;
  background:rgba(186,117,23,.12);
  color:var(--amber2);
  font-weight:700;
}
.abtn.a-pa.pass-pulse .cost{color:rgba(250,199,117,.75);}
/* Cambiar carta — amber, fila completa */
.abtn.a-sw{background:rgba(186,117,23,.1);border-color:rgba(186,117,23,.4);color:var(--amber2);grid-column:1/4;flex-direction:row;gap:6px;padding:8px 14px;}
.abtn.a-sw .cost{margin-top:0;color:rgba(250,199,117,.6);}
.abtn.a-sw:active:not(:disabled){background:rgba(186,117,23,.2);}
.abtn.a-sw:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
/* Comodín — verde esmeralda, fila completa */
.abtn.a-jk{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.45);color:#6ee7b7;grid-column:1/4;flex-direction:row;gap:8px;padding:8px 14px;}
.abtn.a-jk:active:not(:disabled){background:rgba(34,197,94,.22);}
.abtn.a-jk:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
.abtn.a-jk .jk-pips{display:flex;gap:3px;align-items:center;}
.abtn.a-jk .jk-pip{width:8px;height:8px;border-radius:2px;border:1.5px solid rgba(110,231,183,.35);background:transparent;transition:background .2s,border-color .2s;}
.abtn.a-jk .jk-pip.avail{background:#6ee7b7;border-color:#6ee7b7;}
.abtn.a-jk .jk-pip.used{background:#ef4444;border-color:#ef4444;}
.abtn.a-jk .jk-pip.locked{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);}
/* Pips extra (nivel 2 y 3) destacados en amber */
.abtn.a-jk .jk-pip.extra-avail{background:var(--amber2);border-color:var(--amber);}
.abtn.a-jk .jk-pip.extra-used{background:#b45309;border-color:#92400e;}
/* Cost label cuando botón deshabilitado */
.abtn:disabled .cost{color:var(--text3);}
/* Botón Curación de partida */
.abtn.a-hl{background:rgba(124,252,0,.1);border-color:rgba(124,252,0,.45);color:#a0ff40;grid-column:1/4;flex-direction:row;gap:8px;padding:6px 14px;}
.abtn.a-hl:active:not(:disabled){background:rgba(124,252,0,.22);}
.abtn.a-hl:disabled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--text3);}
.abtn.a-hl .hl-pips{display:flex;gap:3px;align-items:center;}
.abtn.a-hl .hl-pip{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(124,252,0,.35);background:transparent;transition:background .2s,border-color .2s;}
.abtn.a-hl .hl-pip.avail{background:#7CFC00;border-color:#a0ff40;}
.abtn.a-hl .hl-pip.used{background:#ef4444;border-color:#ef4444;}

/* BLOG — log de batalla */
.blog{
  flex:1;overflow-y:auto;
  padding:3px 10px;
  display:flex;flex-direction:column;gap:1px;
  min-height:28px;max-height:44px;
}
.blog::-webkit-scrollbar{display:none;}
.blog-entry{font-size:10.5px;color:var(--text2);border-left:2px solid rgba(255,255,255,.08);padding-left:7px;line-height:1.45;}
.blog-entry.dmg{border-left-color:var(--red);color:#f7c1c1;}
.blog-entry.heal{border-left-color:#7CFC00;color:#c8e89f;}
.blog-entry.sys{border-left-color:var(--amber);color:var(--amber2);}
.blog-entry.crit{border-left-color:#ffee00;color:#ffee00;font-weight:700;}
.blog-entry.miss{border-left-color:var(--gray2);color:var(--text2);}
.blog-entry.freeze{border-left-color:var(--cyan2);color:var(--cyan2);}

/* HAND */
.hand-area{padding:7px 10px calc(12px + env(safe-area-inset-bottom, 0px));border-top:2px solid rgba(124,252,0,.2);flex-shrink:0;background:rgba(0,0,0,.35);}
.hand-lbl{
  font-size:8.5px;color:var(--text2);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:5px;display:flex;align-items:center;gap:5px;
}
.hand-lbl span{color:var(--amber2);font-weight:700;}
.hand-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-height:98px;
  touch-action:pan-x;pointer-events:all;
}
.hand-scroll::-webkit-scrollbar{display:none;}
.hcard{
  flex-shrink:0;width:72px;
  background:var(--bg2);border:1.5px solid var(--card-border);
  border-radius:10px;overflow:hidden;cursor:pointer;
  transition:all .15s;opacity:.65;display:flex;flex-direction:column;
  pointer-events:all;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:rgba(186,117,23,.3);
  touch-action:manipulation;
}
.hcard.can-play{border-color:#639922;opacity:1;box-shadow:0 0 10px rgba(99,153,34,.3);}
.hcard.deploy-mode{border-color:var(--amber);box-shadow:0 0 12px rgba(186,117,23,.55);opacity:1;animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(186,117,23,.4);}50%{box-shadow:0 0 18px rgba(186,117,23,.75);}}
.hcard img{width:100%;height:46px;object-fit:cover;display:block;}
.hcard .hc-noimg{width:100%;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.hcard .hc-name{
  font-size:7px;font-weight:700;padding:2px 3px 1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--amber2);text-align:center;
}
.hcard .hc-divider{height:1px;background:rgba(255,255,255,.06);margin:0 4px;}
.hcard .hc-stats{
  display:flex;justify-content:space-evenly;
  padding:2px 2px 3px;font-size:7.5px;
}
.hcard .hc-hp{color:#7CFC00;font-weight:700;}
.hcard .hc-atk{color:#FF6B6B;font-weight:700;}
.hand-empty{font-size:11px;color:var(--text3);padding:8px 0;}

/* DEPLOY BANNER */
/* ── Turn Timer ── */
.turn-timer-bar{
  width:100%;height:5px;background:rgba(255,255,255,.08);
  border-radius:3px;overflow:hidden;margin-top:3px;
}
.turn-timer-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--amber2),var(--amber));
  transition:width .25s linear,background .25s;
}
.turn-timer-fill.danger{ background:linear-gradient(90deg,#e24b4a,#c0392b); }
.turn-timer-label{
  font-size:9px;font-weight:700;color:var(--amber2);letter-spacing:.5px;
  text-align:right;min-width:22px;
}
.turn-timer-label.danger{ color:#e24b4a; }
.deploy-banner{
  background:rgba(186,117,23,.18);
  border-top:1px solid rgba(186,117,23,.5);
  border-bottom:1px solid rgba(186,117,23,.5);
  padding:8px 14px;text-align:center;
  font-size:12px;font-weight:700;color:var(--amber2);
  flex-shrink:0;display:none;
  letter-spacing:.4px;
}
.deploy-banner.show{display:block;animation:pulse2 1.2s infinite;}
.deploy-banner.show.waiting-opp{
  background:rgba(83,74,183,.18);
  border-top-color:rgba(83,74,183,.5);
  border-bottom-color:rgba(83,74,183,.5);
  color:var(--purple2);
  animation:waitingDeploy 1.6s ease-in-out infinite;
}
@keyframes waitingDeploy{
  0%,100%{background:rgba(83,74,183,.12);}
  50%{background:rgba(83,74,183,.28);}
}
@keyframes pulse2{0%,100%{background:rgba(186,117,23,.15);}50%{background:rgba(186,117,23,.3);}}

/* WIN */
#win-screen{background:radial-gradient(ellipse at 50% 30%,#2a2a05 0%,var(--bg) 70%);align-items:center;justify-content:center;}
.win-inner{text-align:center;padding:30px 20px;}
.win-trophy{font-size:80px;margin-bottom:16px;animation:bounce 1s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.win-name{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:4px;color:var(--amber2);line-height:1;}
.win-sub{font-size:13px;color:var(--text2);margin-top:8px;}
.win-btn{display:inline-block;margin-top:30px;background:transparent;border:2px solid var(--amber);color:var(--amber2);border-radius:50px;padding:13px 40px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;}
.win-btn:active{background:rgba(186,117,23,.2);}

/* DICE OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;}
.overlay.show{display:flex;animation:fadeUp .2s ease;}
.dice{width:90px;height:90px;background:var(--bg2);border:3px solid var(--amber);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:58px;color:var(--amber2);}
.dice.rolling{animation:roll .08s infinite;}
@keyframes roll{0%{transform:rotate(-8deg) scale(.95);}100%{transform:rotate(8deg) scale(1.05);}}
.dice.landed{animation:land .3s ease forwards;}
@keyframes land{0%{transform:scale(1.3);}60%{transform:scale(.9);}100%{transform:scale(1);}}
.dice-result{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-top:18px;letter-spacing:1px;}
.dice-result.miss{color:var(--text2);}
.dice-result.half{color:#FAC775;}
.dice-result.normal{color:var(--text);}
.dice-result.crit{color:#ffee00;text-shadow:0 0 20px #ffee00;}
.dice-result.shield-res{color:var(--cyan2);text-shadow:0 0 16px rgba(14,138,138,.7);}
.dice-cont{margin-top:22px;background:var(--amber);border:none;color:#fff;padding:12px 36px;border-radius:30px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer;}
/* Confirmación dual del dado en online */
.dice-confirm-status{font-size:11px;color:var(--text2);margin-top:10px;text-align:center;line-height:1.6;min-height:32px;}
.dice-confirm-status b{color:var(--green2);}
.dice-auto-close{font-size:10px;color:var(--text3);margin-top:4px;}
/* Botón de resincronización en batalla */
#online-sync-btn{background:rgba(83,74,183,.25);border:1px solid rgba(83,74,183,.6);color:var(--purple2);border-radius:16px;padding:4px 10px;font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;cursor:pointer;display:none;letter-spacing:.3px;}
#online-sync-btn:active{background:rgba(83,74,183,.5);}
#online-sync-btn.visible{display:inline-block;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--card-border);border-radius:18px;padding:22px 18px;width:100%;max-width:320px;}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--amber2);margin-bottom:8px;}
.modal p{font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;}
.mbtn2{flex:1;padding:11px;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;}
.mbtn2.ok{background:rgba(226,75,74,.3);color:var(--red2);}
.mbtn2.cancel{background:rgba(255,255,255,.07);color:var(--text);}

/* TOAST */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,.96);border:1px solid var(--card-border);color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:600;pointer-events:none;opacity:0;transition:opacity .25s;white-space:normal;max-width:88vw;width:max-content;max-width:min(440px,88vw);text-align:center;line-height:1.4;}
.toast.show{opacity:1;}

/* RULES */
.rules-body{padding:14px;}
.rule-card{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:12px;}
.rule-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--amber2);letter-spacing:1px;margin-bottom:8px;}
.rule-body{font-size:13px;color:var(--text2);line-height:1.7;}
.rule-body li{margin:4px 0 4px 12px;}
.rule-body b{color:var(--text);}

/* DIAMOND PATTERN - default bg overlay */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,rgba(34,34,63,.55) 0px,rgba(34,34,63,.55) 1px,transparent 1px,transparent 12px),
                   repeating-linear-gradient(-45deg,rgba(34,34,63,.55) 0px,rgba(34,34,63,.55) 1px,transparent 1px,transparent 12px);
  background-size:16px 16px;
}
body.bg-custom::before{display:none;}
.screen{position:relative;z-index:1;}

/* BACKGROUNDS SCREEN */
#bg-screen{background:var(--bg);}
.bg-section{padding:14px;}
.bg-palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.bg-swatch{width:40px;height:40px;border-radius:10px;cursor:pointer;border:2px solid rgba(255,255,255,.12);transition:all .15s;position:relative;}
.bg-swatch.active-bg{border-color:#fff;transform:scale(1.15);box-shadow:0 0 10px rgba(255,255,255,.3);}
.bg-swatch:active{transform:scale(.9);}
.bg-preview-wrap{margin:16px 0 8px;height:80px;border-radius:14px;border:1px solid var(--card-border);overflow:hidden;position:relative;}
.bg-preview-inner{width:100%;height:100%;}
.bg-custom-upload{background:var(--bg2);border:2px dashed var(--card-border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;position:relative;}
.bg-custom-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.bg-custom-thumb{width:100%;max-height:100px;object-fit:cover;border-radius:8px;display:none;margin-top:8px;}
/* ================================================================
   NUEVA HOME — estructura Jugar / Tienda / Ajustes / Stats
================================================================ */
.home-menu-grid{padding:14px;display:flex;flex-direction:column;gap:10px;}
.hmbtn{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--card-border);border-radius:18px;padding:16px 18px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;width:100%;}
.hmbtn:active{background:var(--bg3);}
.hmbtn.prime{background:rgba(186,117,23,.13);border-color:var(--amber);}
.hmbtn.prime:active{background:rgba(186,117,23,.25);}
.hmbtn .hico{font-size:26px;width:34px;text-align:center;flex-shrink:0;}
.hmbtn .htxt{flex:1;}
.hmbtn .htxt small{display:block;font-size:11px;color:var(--text2);font-weight:400;margin-top:1px;}
.hmbtn .harrow{font-size:14px;color:var(--text3);}
.home-coins-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(186,117,23,.18);border:1px solid rgba(186,117,23,.4);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--amber2);}

/* ================================================================
   PANTALLA JUGAR — sub-menú modos
================================================================ */
#play-screen{background:radial-gradient(ellipse at 50% 0%,#1c1c40 0%,var(--bg) 70%);}

/* ================================================================
   PANTALLA STATS
================================================================ */
#stats-screen{background:radial-gradient(ellipse at 50% 0%,#1a1a30 0%,var(--bg) 70%);}
.stats-section{padding:14px 14px 0;}
.stats-card{background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;margin-bottom:12px;}
.stats-head{padding:12px 14px;border-bottom:1px solid var(--card-border);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;}
.stats-grid.two-col{grid-template-columns:repeat(2,1fr);}
.stats-cell{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 6px;text-align:center;}
.stats-num{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;}
.stats-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.stats-total-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--card-border);}
.stats-total-row .stlbl{font-size:11px;color:var(--text2);}
.stats-total-row .stval{font-family:'Bebas Neue',sans-serif;font-size:20px;}

/* ================================================================
   TIENDA
================================================================ */
/* store eliminada temporalmente */

/* ================================================================
   ONLINE SCREEN — añadir info monedas
================================================================ */

#online-screen{background:radial-gradient(ellipse at 50% 0%,#1c1c40 0%,var(--bg) 70%);}
.online-hero{padding:28px 20px 16px;text-align:center;}
.online-hero h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--amber2);}
.online-hero p{font-size:12px;color:var(--text2);margin-top:4px;}
.online-cards{padding:14px;display:flex;flex-direction:column;gap:12px;}
.online-card{background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;padding:18px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;}
.online-card:active{background:var(--bg3);border-color:var(--amber);}
.online-card .mico2{font-size:28px;flex-shrink:0;}
.online-card h3{font-size:15px;font-weight:700;margin-bottom:4px;}
.online-card p{font-size:12px;color:var(--text2);}

/* ── SUBMENÚ PvP MODE ── */
.pvp-mode-section{padding:0 14px 6px;}
.pvp-mode-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;color:var(--text2);text-align:center;margin-bottom:10px;text-transform:uppercase;}
.pvp-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pvp-mode-btn{
  background:var(--bg2);
  border:2px solid var(--card-border);
  border-radius:16px;
  padding:18px 12px;
  cursor:pointer;
  text-align:center;
  transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.pvp-mode-btn:active{background:var(--bg3);}
#pvp-btn-local.selected{
  border-color:var(--cyan);
  background:rgba(14,138,138,.18);
  box-shadow:0 0 14px rgba(14,138,138,.3);
}
#pvp-btn-internet.selected{
  border-color:var(--purple);
  background:rgba(83,74,183,.18);
  box-shadow:0 0 14px rgba(83,74,183,.3);
}
.pvp-mode-btn .pvp-ico{font-size:32px;}
.pvp-mode-btn .pvp-label{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--text);}
#pvp-btn-local.selected .pvp-label{color:var(--cyan2);}
#pvp-btn-internet.selected .pvp-label{color:var(--purple2);}
.pvp-mode-btn .pvp-sub{font-size:10px;color:var(--text3);line-height:1.4;margin-top:2px;}
#pvp-btn-local.selected .pvp-sub{color:rgba(125,224,224,.7);}
#pvp-btn-internet.selected .pvp-sub{color:rgba(206,203,246,.7);}
.pvp-divider{height:1px;background:linear-gradient(90deg,transparent,var(--card-border),transparent);margin:4px 14px 2px;}
/* Sección de sala — oculta hasta elegir modo internet */
.online-room-section{padding:0 14px 6px;display:none;}
.online-room-section.visible{display:block;}
.online-room-section .online-cards{padding:0;margin-top:0;}

/* ── ONLINE SCREEN TABS ── */
#online-screen-tabs .ptab.on { border-bottom-color: var(--purple2); color: var(--purple2); }

/* ── ONLINE MODE CARDS (redesign) ── */
.pvp-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
.pvp-card {
  background: var(--bg2);
  border: 2px solid var(--card-border);
  border-radius: 18px;
  padding: 18px 12px 14px;
  cursor: pointer;
