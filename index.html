  text-align: center;
  transition: all .2s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.pvp-card:active { background: var(--bg3); }
.pvp-card .pvp-card-ico { font-size: 38px; margin-bottom: 2px; }
.pvp-card .pvp-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; color: var(--text); }
.pvp-card .pvp-card-sub { font-size: 10px; color: var(--text3); line-height: 1.4; margin-top: 2px; }
.pvp-card.selected-local {
  border-color: var(--cyan);
  background: rgba(14,138,138,.18);
  box-shadow: 0 0 16px rgba(14,138,138,.3);
}
.pvp-card.selected-local .pvp-card-title { color: var(--cyan2); }
.pvp-card.selected-local .pvp-card-sub { color: rgba(125,224,224,.7); }
.pvp-card.selected-internet {
  border-color: var(--purple);
  background: rgba(83,74,183,.18);
  box-shadow: 0 0 16px rgba(83,74,183,.3);
}
.pvp-card.selected-internet .pvp-card-title { color: var(--purple2); }
.pvp-card.selected-internet .pvp-card-sub { color: rgba(206,203,246,.7); }

/* ── MODO INLINE INFO ── */
.pvp-mode-inline-info {
  margin: 0 14px;
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 11px;
  color: var(--text2);
  line-height: 1.7;
  display: none;
}
.pvp-mode-inline-info.local-info {
  background: rgba(14,138,138,.1);
  border: 1px solid rgba(14,138,138,.35);
}
.pvp-mode-inline-info.internet-info {
  background: rgba(83,74,183,.1);
  border: 1px solid rgba(83,74,183,.3);
}

/* ── ONLINE COLAPSABLES (skill-sec-wrap pattern) ── */
.online-collapse-wrap {
  margin: 0 14px 10px;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid var(--card-border);
  background: var(--bg2);
}
.online-collapse-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 14px;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.online-collapse-toggle:active { background: rgba(255,255,255,.05); }
.online-collapse-body {
  display: none;
  padding: 12px 14px 16px;
  border-top: 1px solid var(--card-border);
}
.online-collapse-body.open { display: block; }
.online-collapse-arrow { margin-left: auto; font-size: 11px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
.online-collapse-arrow.open { transform: rotate(180deg); }

/* ── ONLINE CARDS TAB ── */
#online-panel-cards { display: none; padding: 14px; }
.online-pool-opt {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--card-border);
  background: rgba(255,255,255,.04);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  margin-bottom: 8px;
  transition: all .15s;
}
.online-pool-opt.sel-local { border-color: var(--cyan); background: rgba(14,138,138,.15); }
.online-pool-opt.sel-local .opool-name { color: var(--cyan2); }
.online-pool-opt.sel-internet { border-color: var(--purple); background: rgba(83,74,183,.15); }
.online-pool-opt.sel-internet .opool-name { color: var(--purple2); }
.opool-ico { font-size: 20px; flex-shrink: 0; }
.opool-name { font-size: 13px; font-weight: 700; }
.opool-sub { font-size: 10px; color: var(--text2); font-weight: 400; margin-top: 1px; }

/* ── ONLINE STATS TAB ── */
#online-panel-stats { display: none; padding: 14px; }
.online-stats-card {
  background: rgba(83,74,183,.1);
  border: 1px solid rgba(83,74,183,.35);
  border-radius: 16px;
  padding: 16px;
}

/* Lobby de sala */
#lobby-screen{background:radial-gradient(ellipse at 50% 20%,#1c2040 0%,var(--bg) 70%);}
.lobby-body{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.lobby-body::-webkit-scrollbar{display:none;}
.lobby-code-box{background:var(--bg2);border:2px solid var(--amber);border-radius:18px;padding:22px 28px;text-align:center;width:100%;max-width:320px;}
.lobby-code-title{font-size:11px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.lobby-code{font-family:'Courier New',Courier,monospace;font-size:32px;letter-spacing:4px;color:var(--amber2);word-break:break-all;font-weight:700;}
.lobby-code-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5;}
.lobby-status{font-size:13px;color:var(--text2);text-align:center;display:flex;align-items:center;gap:8px;}
.lobby-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:pulse3 1s infinite;}
.lobby-dot.green{background:#7CFC00;animation:none;}
@keyframes pulse3{0%,100%{opacity:1;}50%{opacity:.3;}}
.lobby-join-box{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:16px;width:100%;max-width:320px;}
.lobby-join-box label{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px;}
.lobby-copy-btn{background:rgba(186,117,23,.15);border:1px solid var(--amber);color:var(--amber2);border-radius:10px;padding:9px 18px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;width:100%;max-width:320px;}
.lobby-copy-btn:active{background:rgba(186,117,23,.3);}
.online-setup-sec{padding:12px;width:100%;max-width:100%;background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;}
.conn-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,109,17,.2);border:1px solid rgba(99,153,34,.4);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--green2);}

/* ── SELECTOR DE MODO DE CARTAS ONLINE ── */
.ommode-panel{width:100%;background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:14px 12px;}
.ommode-title{font-size:13px;font-weight:700;color:var(--amber2);margin-bottom:4px;}
.ommode-sub{font-size:10px;color:var(--text3);margin-bottom:12px;line-height:1.5;}
.ommode-opts{display:flex;flex-direction:column;gap:8px;}
.ommode-opt{background:var(--bg3);border:2px solid var(--card-border);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,background .15s;}
.ommode-opt:active{background:var(--bg4);}
.ommode-opt.selected{border-color:var(--amber);background:rgba(186,117,23,.12);}
.ommode-opt .omico{font-size:24px;flex-shrink:0;margin-top:2px;}
.ommode-opt h4{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text);}
.ommode-opt.selected h4{color:var(--amber2);}
.ommode-opt p{font-size:11px;color:var(--text2);line-height:1.45;}
.ommode-confirm-btn{margin-top:12px;width:100%;background:rgba(186,117,23,.2);border:1px solid var(--amber);color:var(--amber2);border-radius:10px;padding:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.ommode-confirm-btn:active{background:rgba(186,117,23,.35);}
.ommode-confirm-btn:disabled{opacity:.4;cursor:not-allowed;}
.ommode-guest-waiting{background:rgba(83,74,183,.1);border:1px solid rgba(83,74,183,.3);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--text2);line-height:1.6;text-align:center;}
.ommode-guest-waiting b{color:var(--purple2);}

/* ── STEP PILLS — indicador de progreso pre-batalla ── */
.setup-step-pill{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:10px 4px;cursor:default;
  transition:background .2s,color .2s;
}
.setup-step-pill .step-pill-num{
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;
  color:var(--text3);line-height:1;transition:color .2s;
}
.setup-step-pill .step-pill-lbl{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text3);transition:color .2s;
}
.setup-step-pill.active .step-pill-num{color:var(--amber2);}
.setup-step-pill.active .step-pill-lbl{color:var(--amber2);}
.setup-step-pill.active{background:rgba(186,117,23,.1);}
.setup-step-pill.done .step-pill-num{color:var(--green2);font-size:16px;}
.setup-step-pill.done .step-pill-lbl{color:var(--green2);}
.setup-step-sep{width:1px;background:var(--card-border);flex-shrink:0;margin:8px 0;}

/* ── EMOJI PERFIL ── */
.emoji-style{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;display:inline-block;}
.profile-emoji-display{font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--bg3);border-radius:50%;border:2px solid var(--card-border);flex-shrink:0;overflow:hidden;}
.profile-emoji-display img{width:26px;height:26px;object-fit:contain;}
.emoji-picker-wrap{position:fixed;inset:0;z-index:999;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);animation:fadeUp .2s ease;}
.emoji-picker{background:var(--bg2);border:1px solid var(--card-border);border-radius:20px 20px 0 0;padding:16px 14px 32px;width:100%;max-height:55vh;display:flex;flex-direction:column;gap:10px;}
.emoji-picker-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--amber2);text-align:center;}
.emoji-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.emoji-picker-grid button{background:var(--bg3);border:1px solid var(--card-border);border-radius:10px;padding:6px 2px;font-size:22px;cursor:pointer;line-height:1;transition:transform .1s,border-color .1s;}
.emoji-picker-grid button:active{transform:scale(.88);}
.emoji-picker-grid button.selected{border-color:var(--amber);background:rgba(186,117,23,.2);}
.emoji-picker-grid button img{width:26px;height:26px;pointer-events:none;}
.emoji-picker-close{background:rgba(255,255,255,.07);border:1px solid var(--card-border);color:var(--text2);border-radius:10px;padding:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%;}
/* Avatar en batalla */
.fighter-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.fighter-avatar img{width:24px;height:24px;object-fit:contain;}
.f-lbl-inner{display:flex;align-items:center;gap:6px;}
/* Default sounds badge en ajustes */
.default-sound-btn{background:rgba(186,117,23,.12);border:1px solid rgba(186,117,23,.35);color:var(--amber2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.default-sound-btn:active{background:rgba(186,117,23,.28);}

/* Banner de sonidos en lobby online */
.lobby-sound-banner{
  width:100%;max-width:320px;
  background:rgba(83,74,183,.13);
  border:1px solid rgba(83,74,183,.4);
  border-radius:14px;
  padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
}
.lobby-sound-banner.ok{
  background:rgba(59,109,17,.12);
  border-color:rgba(99,153,34,.45);
}
.lobby-sound-banner-row{
  display:flex;align-items:center;gap:8px;
}
.lobby-sound-banner-ico{font-size:20px;flex-shrink:0;}
.lobby-sound-banner-txt{flex:1;}
.lobby-sound-banner-txt b{font-size:12px;font-weight:700;display:block;margin-bottom:1px;}
.lobby-sound-banner-txt small{font-size:10px;color:var(--text2);line-height:1.4;display:block;}
.lobby-sound-load-btn{
  background:rgba(83,74,183,.25);border:1px solid rgba(83,74,183,.6);
  color:var(--purple2);border-radius:10px;
  padding:8px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;width:100%;text-align:center;
}
.lobby-sound-load-btn:active{background:rgba(83,74,183,.45);}
.lobby-sound-load-btn:disabled{opacity:.5;cursor:not-allowed;}
/* Twemoji: tamaños controlados por contexto */
.profile-emoji-display img.emoji{width:26px!important;height:26px!important;vertical-align:middle;}
.fighter-avatar img.emoji{width:22px!important;height:22px!important;vertical-align:middle;}
.emoji-picker-grid button img.emoji{width:24px!important;height:24px!important;pointer-events:none;}

/* Editor: botones de rareza y tipo */
.rarity-btn,.type-btn{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  color:var(--text);padding:5px 12px;border-radius:20px;
  font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;cursor:pointer;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.rarity-btn:active,.type-btn:active{opacity:.7;}
.rarity-btn.selected{background:rgba(255,255,255,.1)!important;box-shadow:0 0 0 1.5px currentColor;}
.type-btn.selected{background:rgba(186,117,23,.18);border-color:var(--amber);color:var(--amber2);}
/* Rareza: glow según nivel en preview card */
.kard.rarity-rare{border-color:#185FA5!important;box-shadow:0 0 0 1px #185FA5,0 0 12px rgba(24,95,165,.3);}
.kard.rarity-epic{border-color:#534AB7!important;box-shadow:0 0 0 1px #534AB7,0 0 14px rgba(83,74,183,.4);}
.kard.rarity-legendary{border-color:#BA7517!important;box-shadow:0 0 0 1.5px #BA7517,0 0 20px rgba(186,117,23,.5);animation:legendaryPulse 2.5s ease-in-out infinite;}
.kard.rarity-mythic{border-color:#C0392B!important;box-shadow:0 0 0 2px #C0392B,0 0 24px rgba(192,57,43,.6),0 0 40px rgba(192,57,43,.2);animation:mythicPulse 2s ease-in-out infinite;}
@keyframes mythicPulse{0%,100%{box-shadow:0 0 0 2px #C0392B,0 0 18px rgba(192,57,43,.5),0 0 36px rgba(192,57,43,.15);}50%{box-shadow:0 0 0 2.5px #E74C3C,0 0 28px rgba(231,76,60,.7),0 0 52px rgba(192,57,43,.3);}}
@keyframes legendaryPulse{0%,100%{box-shadow:0 0 0 2px #BA7517,0 0 16px rgba(186,117,23,.4);}50%{box-shadow:0 0 0 2.5px #FAC775,0 0 28px rgba(250,199,117,.55);}}
/* Rarity badge en la carta */
.k-rarity{font-size:7.5px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-top:2px;opacity:.8;}
.k-rarity.rare{color:#B5D4F4;} .k-rarity.epic{color:#CECBF6;} .k-rarity.legendary{color:#FAC775;} .k-rarity.mythic{color:#E74C3C;}
.k-type{font-size:8px;color:var(--text3);text-align:center;margin-top:1px;letter-spacing:.5px;}
.k-lore{font-size:8px;color:var(--text3);font-style:italic;padding:3px 7px;text-align:center;line-height:1.35;border-top:1px solid rgba(255,255,255,.05);margin-top:3px;}
.k-creator{font-size:7px;color:rgba(255,255,255,.2);text-align:right;padding:2px 7px;letter-spacing:.3px;}

/* ── LOGIN SCREEN ── */
#login-screen{background:radial-gradient(ellipse at 50% 0%,#1c1c40 0%,var(--bg) 70%);justify-content:center;align-items:center;}
.login-box{width:100%;max-width:360px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:8px;color:var(--amber2);line-height:1;text-shadow:0 0 40px rgba(186,117,23,.4);}
.login-tagline{font-size:11px;color:var(--text2);letter-spacing:4px;text-transform:uppercase;}
.login-icon{font-size:48px;filter:drop-shadow(0 0 16px rgba(186,117,23,.5));}
.login-card{width:100%;background:var(--bg2);border:1px solid var(--card-border);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;}
.login-card h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text);text-align:center;}
.login-hint{font-size:11px;color:var(--text2);line-height:1.6;text-align:center;}
.login-hint a{color:var(--amber2);text-decoration:none;}
.login-input{width:100%;background:var(--bg3);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;letter-spacing:.5px;}
.login-input:focus{outline:none;border-color:var(--amber);}
.login-btn{width:100%;background:rgba(186,117,23,.2);border:1px solid var(--amber);border-radius:14px;padding:14px;color:var(--amber2);font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;transition:all .15s;}
.login-btn:active{background:rgba(186,117,23,.35);}
.login-btn:disabled{opacity:.4;cursor:not-allowed;}
.login-skip{font-size:11px;color:var(--text3);cursor:pointer;text-decoration:underline;text-align:center;user-select:none;-webkit-user-select:none;background:none;border:none;font-family:'Nunito',sans-serif;padding:8px 4px;display:block;width:100%;}
.login-skip:hover{color:var(--text2);}
.login-skip:active{color:var(--text);}
.login-error{font-size:11px;color:var(--red2);background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.25);border-radius:8px;padding:8px 12px;text-align:center;display:none;}
.login-error.show{display:block;}
/* ── GITHUB USER BADGE (home) ── */
.gh-badge{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--card-border);border-radius:16px;padding:10px 14px;margin:0 14px 4px;cursor:pointer;transition:border-color .15s;}
.gh-badge:active{border-color:var(--amber);}
.gh-avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--card-border);object-fit:cover;flex-shrink:0;}
.gh-avatar-placeholder{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.gh-info{flex:1;min-width:0;}
.gh-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gh-sub{font-size:10px;color:var(--text2);}
.gh-sync-btn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:10px;border:1px solid rgba(186,117,23,.4);background:rgba(186,117,23,.12);color:var(--amber2);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.gh-sync-btn:active{background:rgba(186,117,23,.25);}
.gh-sync-btn.syncing{opacity:.6;pointer-events:none;}
/* ── SYNC STATUS DOT ── */
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-dot.ok{background:#7CFC00;}
.sync-dot.warn{background:var(--amber2);}
.sync-dot.off{background:var(--text3);}

.skill-cat-header{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:7px 10px;border-radius:10px;margin:6px 0 4px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  user-select:none;-webkit-user-select:none;
  grid-column:1 / -1;
}
.skill-cat-header:active{background:rgba(255,255,255,.09);}
.skill-cat-icon{font-size:15px;line-height:1;}
.skill-cat-label{font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;flex:1;color:var(--text2);}
.skill-cat-arrow{font-size:10px;color:var(--text3);transition:transform .2s;}
.skill-cat-arrow.open{transform:rotate(180deg);}
.skill-cat-body{display:none;grid-column:1 / -1;}
.skill-cat-body.open{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:2px 0 4px;}
/* colores por categoría */
.skill-cat-header.cat-none{border-color:rgba(255,255,255,.1);}
.skill-cat-header.cat-attack{background:rgba(226,75,74,.07);border-color:rgba(226,75,74,.25);}
.skill-cat-header.cat-attack .skill-cat-label{color:#ff8080;}
.skill-cat-header.cat-heal{background:rgba(59,109,17,.08);border-color:rgba(124,252,0,.2);}
.skill-cat-header.cat-heal .skill-cat-label{color:#a0e060;}
.skill-cat-header.cat-shield{background:rgba(24,95,165,.08);border-color:rgba(24,95,165,.3);}
.skill-cat-header.cat-shield .skill-cat-label{color:var(--blue2);}
.skill-cat-header.cat-support{background:rgba(83,74,183,.08);border-color:rgba(83,74,183,.3);}
.skill-cat-header.cat-support .skill-cat-label{color:var(--purple2);}
.skill-cat-header.cat-dot{background:rgba(180,20,40,.07);border-color:rgba(220,60,60,.25);}
.skill-cat-header.cat-dot .skill-cat-label{color:#f08080;}
